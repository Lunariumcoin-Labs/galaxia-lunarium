<!doctype html>
<html lang="pt-BR">
<head>
<!-- This page is served as a static file, so the anti-framing header of the application does not
     reach it: it refuses to be shown inside another site's frame (clickjacking). -->
<style id="antiFrame">html{display:none!important}</style>
<script>if(self===top){var af=document.getElementById("antiFrame");af.parentNode.removeChild(af)}else{try{top.location=self.location}catch(e){}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GaláxiaLunarium · Checkout</title>
<link rel="icon" type="image/png" href="galaxialunarium-logo.png">
<style>
:root{--bg:#081012;--panel:#121b20;--panel2:#0d1519;--line:#26383f;--text:#f4f8f6;--mut:#95a8ad;--green:#20df84;--cyan:#2ecfe6;--amber:#f4b72f;--red:#ff5b5b;font-family:Inter,Segoe UI,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 8%,rgba(46,207,230,.09),transparent 28%),radial-gradient(circle at 78% 92%,rgba(138,92,246,.09),transparent 30%),var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
a{color:var(--cyan)}
.top{display:flex;align-items:center;gap:10px;padding:16px;max-width:820px;margin:0 auto}
.top img{width:38px;height:38px}.top b{font-size:18px}.top b span{color:var(--green)}
main{max-width:820px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 10px}
.mut{color:var(--mut)}.mini{font-size:13px;line-height:1.6}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 16px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:700}
.steps li span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-size:12px}
.steps li.on{color:var(--text)}.steps li.on span{background:var(--green);color:#04130b;border-color:var(--green)}
.steps li.done{color:var(--green)}.steps li.done span{border-color:var(--green)}
.steps li:not(:last-child)::after{content:'';width:24px;height:1px;background:var(--line)}
.prod{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.price{font-size:24px;font-weight:800;color:var(--green);white-space:nowrap}.price small{font-size:13px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#c8d4d7}.fld.full{grid-column:1/-1}
.fld input,.fld textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 11px;width:100%}
.fld input:focus,.fld textarea:focus{outline:2px solid rgba(46,207,230,.35);border-color:var(--cyan)}
.terms{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.terms ol{margin:6px 0 0;padding-left:18px}.terms li{font-size:13px;line-height:1.6;color:#c8d4d7;margin-bottom:6px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:12px 0}
.check input{margin-top:3px;width:18px;height:18px;flex:none}
.btn{background:linear-gradient(90deg,var(--green),var(--cyan));color:#04130b;border:0;border-radius:8px;padding:11px 18px;font-weight:800;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--cyan);font-family:ui-monospace,Consolas,monospace;font-size:14px}
.row code.big{font-size:20px;font-weight:800;color:var(--green)}
.lbl{display:block;color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;margin:14px 0 5px}
.qr{margin:14px 0;display:inline-block;padding:8px;background:#fff;border-radius:8px;line-height:0}
.status{font-weight:700;color:var(--amber)}.ok{color:var(--green);font-weight:700;line-height:1.5}.err{color:var(--red);font-size:14px;min-height:18px}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.choose a{display:block;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}
.choose a b{display:block;margin-bottom:6px}
.tkHead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.tkHead img{width:44px;height:44px}.tkHead .who{flex:1}.tkHead .who b{display:block;font-size:17px}.tkNo{text-align:right}.tkNo b{display:block;font-size:18px;color:var(--green)}
.tkGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.tkGrid div{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.tkGrid label{display:block;color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;border:1px solid}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#f4f6f7;--line:#cfd6d9;--text:#111;--mut:#555;--green:#0a7a45;--cyan:#0a5f73}
  body{background:#fff}.noPrint{display:none!important}.card{border:1px solid #cfd6d9;box-shadow:none}
}
</style>
</head>
<body>
<header class="top noPrint"><img src="galaxialunarium-logo.png" alt=""><b>Galáxia<span>Lunarium</span></b></header>
<main id="app"><div class="card mut">…</div></main>
<script src="galaxialunarium-checkout-i18n.js?v=5"></script>
<script src="galaxialunarium-checkout.js?v=9"></script>
</body>
</html>
